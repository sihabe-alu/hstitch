<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hstitch (offline)</title>
<style>
  body { font: 15px system-ui, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; }
  #drop { border: 2px dashed #888; border-radius: 8px; min-height: 170px; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
  #drop.over { background: #eef; }
  #thumbs { display: flex; gap: 8px; margin: 12px 0; }
  .t { text-align: center; }
  .t img { height: 80px; display: block; }
  #out { max-width: 100%; margin-top: 16px; }
  .bar { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  #notice { color: #b45309; }
</style>
<div id="drop">사진 2~3장을 끌어놓거나 클릭해서 선택</div>
<input id="file" type="file" accept="image/*" multiple hidden>
<div id="thumbs"></div>
<div class="bar">
  <label><input type="radio" name="fmt" value="png" checked> PNG (무손실)</label>
  <label><input type="radio" name="fmt" value="jpeg"> JPEG</label>
  <label><input type="checkbox" id="fit"> 높이 맞춤 (작은 사진 확대)</label>
  <button id="go" disabled>이어붙이기</button>
  <a id="dl" hidden>다운로드</a>
  <span id="msg"></span>
</div>
<div id="notice"></div>
<img id="out" alt="">
<script>
const $ = id => document.getElementById(id);
let files = [];

// 브라우저 canvas 한계(보수적 값): 한 변 최대 px, 전체 면적 최대 px
const MAX_SIDE = 16384;
const MAX_AREA = 268435456;

function render() {
  $('thumbs').replaceChildren(...files.map((f, i) => {
    const d = document.createElement('div'); d.className = 't';
    const img = document.createElement('img'); img.src = URL.createObjectURL(f);
    const l = document.createElement('button'); l.textContent = '←'; l.disabled = i === 0;
    l.onclick = () => { [files[i-1], files[i]] = [files[i], files[i-1]]; render(); };
    const r = document.createElement('button'); r.textContent = '→'; r.disabled = i === files.length - 1;
    r.onclick = () => { [files[i+1], files[i]] = [files[i], files[i+1]]; render(); };
    const x = document.createElement('button'); x.textContent = '×';
    x.onclick = () => { files.splice(i, 1); render(); };
    d.append(img, l, r, x);
    return d;
  }));
  $('go').disabled = files.length === 0;
}

function add(list) { files.push(...[...list].filter(f => f.type.startsWith('image/'))); render(); }

$('drop').onclick = () => $('file').click();
$('file').onchange = e => { add(e.target.files); e.target.value = ''; };
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = e => { e.preventDefault(); $('drop').classList.remove('over'); add(e.dataTransfer.files); };

async function stitch(files, fmt, fit) {
  const bmps = await Promise.all(files.map(f => createImageBitmap(f)));
  const height = Math.max(...bmps.map(b => b.height));
  const sizes = bmps.map(b => fit && b.height < height
    ? { w: Math.round(b.width * height / b.height), h: height }
    : { w: b.width, h: b.height });
  const width = sizes.reduce((s, z) => s + z.w, 0);

  const scale = Math.min(1, MAX_SIDE / width, MAX_SIDE / height, Math.sqrt(MAX_AREA / (width * height)));
  const cw = Math.max(1, Math.floor(width * scale));
  const ch = Math.max(1, Math.floor(height * scale));

  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cw, ch);
  let x = 0;
  bmps.forEach((b, i) => {
    const w = Math.round(sizes[i].w * scale), h = Math.round(sizes[i].h * scale);
    ctx.drawImage(b, x, Math.floor((ch - h) / 2), w, h);
    x += w;
  });
  bmps.forEach(b => b.close());

  const blob = await new Promise(res => canvas.toBlob(res, `image/${fmt}`, 1));
  if (!blob) throw new Error('캔버스 생성 실패 (메모리 부족?)');
  return { blob, scale, width, height, cw, ch };
}

$('go').onclick = async () => {
  const fmt = document.querySelector('input[name=fmt]:checked').value;
  $('msg').textContent = '처리 중…';
  $('notice').textContent = '';
  try {
    const r = await stitch(files, fmt, $('fit').checked);
    const url = URL.createObjectURL(r.blob);
    $('out').src = url;
    $('dl').href = url;
    $('dl').download = 'stitched.' + (fmt === 'jpeg' ? 'jpg' : 'png');
    $('dl').hidden = false;
    $('msg').textContent = '';
    if (r.scale < 1) $('notice').textContent =
      `알림: 브라우저 최대 크기를 넘어 ${r.width}×${r.height} → ${r.cw}×${r.ch}px로 축소했습니다.`;
  } catch (e) {
    $('msg').textContent = '오류: ' + e.message;
  }
};
</script>
</html>
